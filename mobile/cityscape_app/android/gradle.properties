org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Ajoutes automatiquement par le migrateur Flutter a chaque build. Actes ici
# une bonne fois pour que l'arbre de travail cesse d'etre sali a chaque
# compilation. Conservent le comportement actuel : la compilation Kotlin
# integree et le nouveau DSL Gradle restent desactives.
android.builtInKotlin=false
android.newDsl=false
