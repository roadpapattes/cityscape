<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.roadpapattes.cityscape">
    <title>Redirection - CityScape</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        .logo {
            font-size: 64px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .message {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .playstore-btn {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 16px 40px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .playstore-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🏙️</div>
        <h1>Redirection en cours...</h1>

        <div class="message">
            <p>Le téléchargement direct de l'APK n'est plus disponible.</p>
            <p>Vous allez être redirigé vers le <strong>Google Play Store</strong>.</p>
        </div>

        <div class="spinner"></div>

        <p style="color: #999; font-size: 14px; margin: 20px 0;">Si la redirection ne fonctionne pas, cliquez sur le bouton ci-dessous :</p>

        <a href="https://play.google.com/store/apps/details?id=com.roadpapattes.cityscape" class="playstore-btn">
            📱 Aller sur le Play Store
        </a>
    </div>

    <script>
        // Redirection JavaScript en backup
        setTimeout(function() {
            window.location.href = 'https://play.google.com/store/apps/details?id=com.roadpapattes.cityscape';
        }, 2000);
    </script>
</body>
</html>
