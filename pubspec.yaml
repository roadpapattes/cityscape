# pubspec.yaml — Escape City (auth + favoris + maps)
name: escape_city_client_clean
description: Escape City — liste + carte, auth token, favoris, clustering custom
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Carto + géoloc
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0

  # Réseau + stockage local + intents
  http: ^1.2.1
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
