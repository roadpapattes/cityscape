# HTTP -> HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name api.cityscape.ovh;
  return 301 https://$host$request_uri;
}

# HTTPS unique
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name api.cityscape.ovh;

  client_max_body_size 50m;

  # Certbot (chemins créés par certbot)
  ssl_certificate /etc/letsencrypt/live/api.cityscape.ovh/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.cityscape.ovh/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Statiques / médias
  location /static/ { alias /var/www/cityscape/static/; }
  location /media/  { alias /var/www/cityscape/media/;  }

  # Téléchargements APK
  location /downloads/ {
    alias /var/www/cityscape/downloads/;
    autoindex on;
    index index.html;
    add_header Cache-Control "public, max-age=3600";
  }

  # Interface React Creator
  location /creator {
    alias /var/www/cityscape/creator-web;
    try_files $uri $uri/ /creator/index.html;
    index index.html;

    # Fichiers hashés (nom change à chaque build) : cache long sans risque
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # index.html : jamais de cache navigateur, sinon les déploiements
    # suivants restent invisibles tant que le cache n'expire pas
    location = /creator/index.html {
      add_header Cache-Control "no-cache, must-revalidate";
    }
  }

# Assets de la home (/icon.svg, favicons, QR)
  location ~* \.(?:svg|png|ico)$ {
    root /var/www/cityscape/www;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

# Homepage statique uniquement pour "/"
  location = / {
    root /var/www/cityscape/www;
    try_files /index.html =404;
  }

  # Proxy vers Django (Gunicorn)
  location / {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hardening
  location ~ /\.(?!well-known) { deny all; }
}
